<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="description" content="把 WorkBuddy 生成的内容统一归档、随手打标签、按标签回看。公开可看，无需登录。">
<title>云端信息库</title>
<link rel="icon" href="./favicon.svg" type="image/svg+xml">
<link rel="alternate icon" href="./favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<meta name="theme-color" content="#2563eb">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<!-- 键盘用户的第一个落点：一下 Tab 就能跳过顶栏 -->
<a class="skip-link" href="#main-content">跳到主要内容</a>

<!-- ══════════ 启动中 ══════════ -->
<div id="boot" class="boot" role="status" aria-live="polite">
  <div class="boot-mark" aria-hidden="true">
    <svg viewBox="0 0 32 32" aria-hidden="true"><g fill="currentColor"><circle cx="11.7" cy="14.3" r="4"/><circle cx="16.2" cy="11.6" r="5.4"/><circle cx="20.7" cy="14.7" r="3.6"/><rect x="11.7" y="13.3" width="9" height="5"/></g><path d="M10.6 21.05 v1.1 a2.5 2.5 0 0 0 2.5 2.5 h5.8 a2.5 2.5 0 0 0 2.5 -2.5 v-1.1" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>
  </div>
  <p>正在载入…</p>
</div>

<!-- ══════════ 主界面 ══════════ -->
<div id="main-view" class="main-view is-hidden">

  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" aria-hidden="true"><g fill="currentColor"><circle cx="11.7" cy="14.3" r="4"/><circle cx="16.2" cy="11.6" r="5.4"/><circle cx="20.7" cy="14.7" r="3.6"/><rect x="11.7" y="13.3" width="9" height="5"/></g><path d="M10.6 21.05 v1.1 a2.5 2.5 0 0 0 2.5 2.5 h5.8 a2.5 2.5 0 0 0 2.5 -2.5 v-1.1" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/></svg>
      </div>
      <span class="brand-name">云端信息库</span>
      <span class="pub-badge">公开可看</span>
    </div>

    <!-- 收藏视角开关 + 内容统计：只留一个图标和一行数字，都在顶栏 -->
    <div class="topbar-status">
      <button type="button" class="fav-btn" id="btn-fav" title="只看收藏" aria-label="只看收藏" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.8.85-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.85z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
      </button>
      <span class="stat" id="stat-text" role="status" aria-live="polite"></span>
    </div>

    <div class="topbar-actions">
      <button type="button" class="btn btn-ghost" id="btn-api" title="推送数据开放接口" aria-label="推送数据开放接口说明">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 8.5L5 12l4 3.5M15 8.5L19 12l-4 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>接口</span>
      </button>
      <button type="button" class="btn btn-ghost" id="btn-msg" title="留言" aria-label="留言板">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 6.6A2.6 2.6 0 017.1 4h9.8a2.6 2.6 0 012.6 2.6v6.8a2.6 2.6 0 01-2.6 2.6H9.6l-5.1 3.6V6.6z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
        <span>留言</span>
        <span class="btn-badge is-hidden" id="msg-badge" aria-hidden="true"></span>
      </button>
      <button type="button" class="btn btn-ghost" id="btn-refresh" title="重新载入" aria-label="重新载入内容">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11a8.5 8.5 0 10-2.5 6.4M20.5 5v6h-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span>刷新</span>
      </button>
    </div>
  </header>

  <main class="content" id="main-content" tabindex="-1">

    <section class="inbox-bar is-hidden" id="inbox-bar" aria-live="polite">
      <div class="inbox-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v9m0 0l-3.5-3.5M12 12l3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 15v3a2 2 0 002 2h12a2 2 0 002-2v-3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </div>
      <div class="inbox-text">
        <strong id="inbox-count">0</strong> 个新内容待入库
        <span class="inbox-hint" id="inbox-hint"></span>
      </div>
      <div class="inbox-actions">
        <button type="button" class="btn btn-primary btn-sm" id="btn-archive-all">全部入库</button>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-dismiss-inbox">忽略</button>
      </div>
    </section>

    <section class="toolbar" aria-label="内容筛选">
      <div class="chips" id="type-chips"></div>
    </section>

    <section class="tag-row is-hidden" id="tag-row" aria-label="按标签筛选"></section>

    <section class="grid" id="doc-grid" aria-busy="false" aria-label="内容列表"></section>

    <section class="empty is-hidden" id="empty" role="status">
      <div class="empty-mark" aria-hidden="true">
        <svg viewBox="0 0 48 48" aria-hidden="true"><rect x="9" y="7" width="30" height="34" rx="4" fill="none" stroke="currentColor" stroke-width="2.4"/><path d="M17 18h14M17 25h14M17 32h8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </div>
      <h3 id="empty-title">还是空的</h3>
      <p id="empty-desc">WorkBuddy 推送过来的内容会出现在这里。给它们打上标签，以后就能按标签快速翻出来。</p>
    </section>

  </main>
</div>

<!-- ══════════ 预览 ══════════ -->
<div id="preview" class="preview is-hidden" role="region" aria-label="内容预览">
  <div class="preview-bar">
    <button type="button" class="btn btn-ghost btn-sm" id="preview-back">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      返回
    </button>
    <div class="preview-title" id="preview-title"></div>
    <div class="preview-actions">
      <button type="button" class="btn btn-ghost btn-sm btn-star" data-act="star" id="preview-star" title="收藏 / 取消收藏" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.6l2.6 5.3 5.8.85-4.2 4.1 1 5.8-5.2-2.7-5.2 2.7 1-5.8-4.2-4.1 5.8-.85z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        <span>收藏</span>
      </button>
      <button type="button" class="btn btn-ghost btn-sm" data-act="tag" title="编辑标签">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.6 12.9l-7.7 7.7a1.5 1.5 0 01-2.1 0l-7.4-7.4a1.5 1.5 0 01-.44-1.06V5.5a1.5 1.5 0 011.5-1.5h6.6c.4 0 .78.16 1.06.44l7.5 7.5a1.5 1.5 0 010 2.06z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><circle cx="8.5" cy="8.5" r="1.45" fill="currentColor"/></svg>
        <span>标签</span>
      </button>
      <button type="button" class="btn btn-ghost btn-sm" data-act="open">新窗口</button>
      <button type="button" class="btn btn-ghost btn-sm" data-act="download">下载</button>
      <button type="button" class="btn btn-ghost btn-sm" data-act="edit">编辑信息</button>
      <button type="button" class="btn btn-ghost btn-sm btn-danger" data-act="delete">删除</button>
    </div>
  </div>
  <div class="preview-body">
    <iframe id="preview-frame" title="内容预览" sandbox="allow-scripts allow-popups allow-forms allow-modals allow-pointer-lock"></iframe>
  </div>
</div>

<!-- ══════════ 编辑标签 ══════════ -->
<div id="tag-modal" class="modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="tag-title">
  <div class="modal-card modal-card-sm">
    <div class="modal-head">
      <h2 id="tag-title">编辑标签</h2>
      <button type="button" class="icon-btn" id="tag-close" aria-label="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <div class="modal-body">
      <p class="tag-doc" id="tag-doc"></p>

      <div class="field">
        <span class="field-label" id="tag-input-label">添加标签</span>
        <input type="text" id="tag-input" placeholder="输入后按回车，或用逗号分隔" autocomplete="off" spellcheck="false" aria-labelledby="tag-input-label">
      </div>

      <div class="tag-current" id="tag-current" role="group" aria-label="已选标签"></div>
      <div class="tag-pool" id="tag-pool" role="group" aria-label="已有标签"></div>

      <p class="modal-msg" id="tag-msg" role="status" aria-live="polite"></p>
    </div>

    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" id="tag-cancel">取消</button>
      <button type="button" class="btn btn-primary" id="tag-save">保存</button>
    </div>
  </div>
</div>

<!-- ══════════ 编辑信息 ══════════ -->
<div id="edit-modal" class="modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="edit-modal-title">
  <div class="modal-card modal-card-sm">
    <div class="modal-head">
      <h2 id="edit-modal-title">编辑信息</h2>
      <button type="button" class="icon-btn" id="edit-close" aria-label="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label class="field-label" for="edit-title">标题</label>
        <input type="text" id="edit-title">
      </div>
      <div class="field">
        <label class="field-label" for="edit-summary">摘要</label>
        <textarea id="edit-summary" rows="3"></textarea>
      </div>
      <div class="field">
        <label class="field-label" for="edit-tags">标签 <em>逗号分隔</em></label>
        <input type="text" id="edit-tags">
        <div class="tag-suggest is-hidden" id="edit-tag-suggest"></div>
      </div>
      <div class="field">
        <label class="field-label" for="edit-type">类型</label>
        <select id="edit-type">
          <option value="report">报告</option>
          <option value="dashboard">看板</option>
          <option value="tool">工具</option>
          <option value="page">页面</option>
          <option value="other">其他</option>
        </select>
      </div>
      <p class="modal-msg" id="edit-msg" role="status" aria-live="polite"></p>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" id="edit-cancel">取消</button>
      <button type="button" class="btn btn-primary" id="edit-confirm">保存</button>
    </div>
  </div>
</div>

<!-- ══════════ 推送数据开放接口 ══════════ -->
<div id="api-modal" class="modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="api-title">
  <div class="modal-card modal-card-lg">
    <div class="modal-head">
      <h2 id="api-title">推送数据 · 开放接口</h2>
      <button type="button" class="icon-btn" id="api-close" aria-label="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body" id="api-body"></div>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" id="api-copy">复制接口地址</button>
      <button type="button" class="btn btn-primary" id="api-ok">知道了</button>
    </div>
  </div>
</div>

<!-- ══════════ 留言 ══════════ -->
<div id="msg-modal" class="modal is-hidden" role="dialog" aria-modal="true" aria-labelledby="msg-title">
  <div class="modal-card modal-card-lg">
    <div class="modal-head">
      <h2 id="msg-title">留言</h2>
      <button type="button" class="icon-btn" id="msg-close" aria-label="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="modal-body modal-body-split">
      <div class="msg-compose">
        <label class="visually-hidden" for="msg-body">留言内容</label>
        <textarea id="msg-body" rows="3" maxlength="2000" placeholder="说点什么…（Ctrl / ⌘ + Enter 发送）"></textarea>
        <div class="msg-compose-foot">
          <label class="visually-hidden" for="msg-author">署名</label>
          <input type="text" id="msg-author" maxlength="40" placeholder="署名（选填）" autocomplete="off">
          <button type="button" class="btn btn-primary btn-sm" id="msg-send">发送</button>
        </div>
        <p class="modal-msg" id="msg-msg" role="status" aria-live="polite"></p>
      </div>
      <div class="msg-list" id="msg-list" role="log" aria-live="polite" aria-label="留言列表"></div>
    </div>
  </div>
</div>

<!-- ══════════ 二次确认 ══════════ -->
<div id="confirm-modal" class="modal is-hidden" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title" aria-describedby="confirm-text">
  <div class="modal-card modal-card-sm">
    <div class="modal-head">
      <h2 id="confirm-title">确认</h2>
    </div>
    <div class="modal-body">
      <p class="confirm-text" id="confirm-text"></p>
    </div>
    <div class="modal-foot">
      <button type="button" class="btn btn-ghost" id="confirm-cancel">取消</button>
      <button type="button" class="btn btn-danger-solid" id="confirm-ok">确定</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script src="./config.js"></script>
<script src="./vendor/workbuddy-cloud-sdk.js"></script>
<script src="./app.js"></script>
</body>
</html>
